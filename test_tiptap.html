<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tiptap Test</title>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { Editor } from 'https://esm.sh/@tiptap/core';
    import Document from 'https://esm.sh/@tiptap/extension-document';
    import Paragraph from 'https://esm.sh/@tiptap/extension-paragraph';
    import Text from 'https://esm.sh/@tiptap/extension-text';
    import TaskList from 'https://esm.sh/@tiptap/extension-task-list';
    import TaskItem from 'https://esm.sh/@tiptap/extension-task-item';

    // We need to test the YJS hydration phase
    import Collaboration from 'https://esm.sh/@tiptap/extension-collaboration';
    import * as Y from 'https://esm.sh/yjs';

    const ydoc = new Y.Doc();

    const editor = new Editor({
      element: document.querySelector('#root'),
      extensions: [
        Document,
        Paragraph,
        Text,
        TaskList,
        TaskItem.configure({ nested: true }),
        Collaboration.configure({ document: ydoc })
      ],
      content: '', // Collaboration plugin requires setting content after init?
    });

    setTimeout(() => {
      try {
        editor.chain().clearContent().insertContent(`
<h1>📅 Daily Journal: 2024-05-20</h1>
<h2>🎯 Top Priorities</h2>
<ul data-type="taskList">
<li data-type="taskItem" data-checked="false"><p>&nbsp;</p></li>
<li data-type="taskItem" data-checked="false"><p>&nbsp;</p></li>
<li data-type="taskItem" data-checked="false"><p>&nbsp;</p></li>
</ul>
<h2>📝 Notes</h2>
<ul>
<li><p>&nbsp;</p></li>
</ul>
<h2>🧠 Reflections</h2>
<ul>
<li><p>&nbsp;</p></li>
</ul>
        `).run();
        console.log('Hydrated', editor.getHTML());
      } catch (e) {
        console.error('Error hydrating:', e.message);
      }
    }, 100);
  </script>
</body>
</html>

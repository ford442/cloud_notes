<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tiptap Test</title>
</head>
<body>
  <div id="editor"></div>
  <script type="module">
    import { Editor } from 'https://esm.sh/@tiptap/core'
    import StarterKit from 'https://esm.sh/@tiptap/starter-kit'
    import TaskList from 'https://esm.sh/@tiptap/extension-task-list'
    import TaskItem from 'https://esm.sh/@tiptap/extension-task-item'

    try {
        const editor = new Editor({
          element: document.querySelector('#editor'),
          extensions: [
            StarterKit,
            TaskList,
            TaskItem.configure({
              nested: true,
            }),
          ],
        })

        editor.chain().clearContent().insertContent('<ul data-type="taskList">\n<li data-type="taskItem" data-checked="false"><p></p></li>\n</ul>').run()
        console.log("SUCCESS:", editor.getHTML())
    } catch (e) {
        console.error("ERROR:", e)
    }
  </script>
</body>
</html>
